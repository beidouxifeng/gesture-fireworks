<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掌上烟花</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #status { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 16px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; z-index: 100; }
    </style>
</head>
<body>
    <video id="video" playsinline autoplay></video>
    <div id="status">加载中...</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        console.log('脚本开始执行');

        const statusEl = document.getElementById('status');
        const videoEl = document.getElementById('video');

        statusEl.textContent = '正在初始化摄像头...';

        async function init() {
            try {
                statusEl.textContent = '请求摄像头权限...';
                console.log('请求摄像头权限');

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 320, height: 240 }
                });

                statusEl.textContent = '摄像头已连接，正在初始化 MediaPipe...';
                console.log('摄像头已连接');

                videoEl.srcObject = stream;

                await new Promise(resolve => {
                    videoEl.onloadedmetadata = resolve;
                });

                statusEl.textContent = '初始化 MediaPipe Hands...';
                console.log('视频元数据加载完成');

                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 0,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((results) => {
                    console.log('检测到手部:', results.multiHandLandmarks ? results.multiHandLandmarks.length : 0);
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        statusEl.textContent = '检测到手部! 数量: ' + results.multiHandLandmarks.length;
                    }
                });

                const camera = new Camera(videoEl, {
                    onFrame: async () => {
                        await hands.send({ image: videoEl });
                    },
                    width: 320,
                    height: 240
                });

                await camera.start();
                statusEl.textContent = '成功! 可以挥手下烟花了';
                console.log('Camera started successfully');

            } catch (error) {
                statusEl.textContent = '错误: ' + error.message;
                console.error('Error:', error);
            }
        }

        init();
    </script>
</body>
</html>
